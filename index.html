<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>География: Горы</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1e1e28; /* DARK_BG */
            color: #f0f0f0; /* TEXT_COLOR */
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        #game-container {
            width: 100vw;
            height: 100vh;
            max-width: 800px;
            max-height: 700px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            box-sizing: border-box;
            padding: 40px 20px;
            position: relative;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .active {
            display: flex;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 50px;
            font-weight: normal;
        }

        .btn {
            background-color: #4682b4; /* BUTTON_COLOR */
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 28px; /* font_medium */
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            outline: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .btn:hover {
            background-color: #6495ed; /* BUTTON_HOVER */
        }

        #game-screen {
            justify-content: flex-start;
        }

        .image-wrapper {
            width: 100%;
            max-width: 600px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
        }

        #mountain-img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        .bottom-area {
            margin-top: auto;
            margin-bottom: 40px;
            height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        #mountain-title {
            font-size: 40px;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: normal;
        }

        .fs-hint {
            position: absolute;
            bottom: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>

    <div id="game-container">
        
        <div id="menu-screen" class="screen active">
            <h1>География: Горы</h1>
            <button class="btn" style="width: 200px;" onclick="startNewGame()">Начать</button>
        </div>

        <div id="game-screen" class="screen">
            <div class="image-wrapper">
                <img id="mountain-img" src="" alt="Горы">
            </div>
            
            <div class="bottom-area">
                <button id="btn-reveal" class="btn" style="width: 300px;" onclick="revealName()">Показать название</button>
                
                <h2 id="mountain-title" style="display: none;"></h2>
                <button id="btn-next" class="btn" style="width: 200px; display: none;" onclick="nextPhoto()">Дальше</button>
            </div>
        </div>

        <div class="fs-hint">F11 — Полноэкранный режим</div>
    </div>

    <script>
        // Список названий файлов, считанный с вашего скриншота
        const ALL_IMAGES = [
            "Alpid.png",
            "Andid.png",
            "Apalatšid.png",
            "Apenniinid.png",
            "Atlas.png",
            "Brasiilia.png",
            "Draakonimäed.png",
            "Etioopia.png",
            "Gangese Madalik.png",
            "Himaalaja.png",
            "Ida-Euroopa lauskmaa.png",
            "induse madalik.png",
            "Kaljumäestik.png",
            "Karpaadid.png",
            "Kaspia alamik.png",
            "Kaukasus.png",
            "Kordiljeerid.png",
            "Lääne-Siberi lauskmaa.png",
            "Püreneed .jpg",
            "Sierra Nevada.png",
            "Skandinaavia.png",
            "Suur Tasandik.png",
            "Suur Veelahkmeahelik.png",
            "Suur-Hiina tasandik.png",
            "Tiibet.png",
            "Uural.png"
        ];

        let playlist = [];
        let currentImageName = "";

        // Перемешивание массива
        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Старт новой игры
        function startNewGame() {
            playlist = [...ALL_IMAGES];
            shuffle(playlist);
            
            document.getElementById("menu-screen").classList.remove("active");
            document.getElementById("game-screen").classList.add("active");
            
            nextPhoto();
        }

        // Загрузка следующего фото
        function nextPhoto() {
            if (playlist.length === 0) {
                document.getElementById("game-screen").classList.remove("active");
                document.getElementById("menu-screen").classList.add("active");
                return;
            }

            currentImageName = playlist.pop();

            // Безопасно убираем расширение (поддерживает и .png, и .jpg)
            const title = currentImageName.substring(0, currentImageName.lastIndexOf('.')) || currentImageName;
            
            const imgElement = document.getElementById("mountain-img");
            imgElement.src = currentImageName;

            // Пропуск поврежденного/отсутствующего файла
            imgElement.onerror = function() {
                console.log("Ошибка загрузки файла: " + currentImageName);
                nextPhoto(); 
            };

            // Обрезаем лишние пробелы по краям текста (как .strip() в Python)
            document.getElementById("mountain-title").textContent = title.trim();

            // Переключение интерфейса на показ фото
            document.getElementById("btn-reveal").style.display = "block";
            document.getElementById("mountain-title").style.display = "none";
            document.getElementById("btn-next").style.display = "none";
        }

        // Показать название
        function revealName() {
            document.getElementById("btn-reveal").style.display = "none";
            document.getElementById("mountain-title").style.display = "block";
            document.getElementById("btn-next").style.display = "block";
        }

        // Поддержка F11 для полноэкранного режима
        document.addEventListener("keydown", function(event) {
            if (event.key === "F11") {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {});
                } else {
                    document.exitFullscreen();
                }
            }
        });
    </script>
</body>
</html>
